<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- PWA -->
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <meta property="og:image" content="/og-share-image.png" />
  <meta property="og:title" content="Action App" />
  <meta property="og:description" content="Your mobile fitness companion. No more excuses." />

  <!-- Performance hints -->
  <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
  <link rel="dns-prefetch" href="https://www.youtube.com" />

  <!-- Inter: clean, neutral sans with great numerals -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />

  <title>Action App</title>
  <link rel="stylesheet" href="/src/styles/main.css" />
</head>
<body class="bg-slate-950 text-slate-100 antialiased min-h-screen">
  <div id="app" class="min-h-screen flex flex-col"></div>
  <a id="submit-pill" href="/submit"
    class="fixed bottom-5 right-5 z-40 flex items-center gap-1.5 rounded-full border border-slate-700/70 bg-slate-900/80 px-3.5 py-2 text-xs font-medium text-slate-300 shadow-lg backdrop-blur-md transition-colors hover:border-brand-400 hover:text-brand-400"
    aria-label="Submit an exercise or workout">
    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
    </svg>
    Submit
  </a>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
