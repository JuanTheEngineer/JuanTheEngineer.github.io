<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=0.7">
    <link rel="stylesheet" type="text/css" href="style.css" />
        <meta charset="utf-8">
    <meta name="description" content="No more excuses. Pick a workout, follow the exercises, and get moving.">
    <meta name="theme-color" content="#0f172a">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="manifest" href="site.webmanifest">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Action App">
    <meta property="og:description" content="No more excuses.">
    <meta property="og:image" content="og-share-image.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Action App">
    <meta name="twitter:description" content="No more excuses.">
    <meta name="twitter:image" content="og-share-image.png">
    <title>Action App - Programs</title>
</head>
<body>
<div id="page">
    <div id="header">
        <img src="logo.png" alt="Action App" />
        <!-- You can include your site's title here -->
    </div>

    <div id="content">
        <div id="container">
            <div id="main">
                <div id="menu">
                    <ul>
                        <li><a href="index.html">Home</a></li>
                        <li><a href="start.html">Start</a></li>
                        <li><a href="programs.html">Programs</a></li>
                        <li><a href="glossary.html">Glossary</a></li>
                    </ul>
                </div>

                <div id="text">
                    <h1>Programs</h1>
                    <!-- The list of programs will be generated here -->
                    <dl id="programList"></dl>
                </div>
            </div>
        </div>
        <div class="clear"></div>
        <div id="footer">
            <p><a href="https://github.com/JuanTheEngineer">Created by Juan the Engineer</a></p>
        </div>
    </div>
</div>

<script>
    // Fetch the JSON data and build the list of program links
    fetch('workouts.json')
        .then(response => response.json())
        .then(data => {
            const programList = document.getElementById('programList');

            data.programs.forEach(program => {
                // Create the title link (<dt> element)
                const dt = document.createElement('dt');
                const a = document.createElement('a');
                a.href = "program.html?id=" + encodeURIComponent(program.id);
                a.className = "links";
                a.innerHTML = "<b>" + program.title + "</b>";
                dt.appendChild(a);

                // Create the requirements description (<dd> element)
                const dd = document.createElement('dd');
                dd.textContent = "Requirements: " + program.requirements;

                // Append the elements to the list
                programList.appendChild(dt);
                programList.appendChild(dd);
            });
        })
        .catch(error => console.error('Error fetching programs:', error));
</script>
</body>
</html>
